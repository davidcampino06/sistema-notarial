# Puerto: Render lo entrega en la variable PORT (en el PC se usa 8080)
server.port=${PORT:8080}

# La conexión a MongoDB la hace la clase BaseDatos (no la configuración automática de Spring)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# Fechas en formato texto (ISO) en las respuestas JSON
spring.jackson.serialization.write-dates-as-timestamps=false
