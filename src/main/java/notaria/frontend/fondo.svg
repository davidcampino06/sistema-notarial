<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen de fondo del inicio de sesión: edificio de la notaría al atardecer -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3039"/>
      <stop offset="0.55" stop-color="#5d5f63"/>
      <stop offset="1" stop-color="#8b7d6d"/>
    </linearGradient>
    <linearGradient id="concreto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7a9ab"/>
      <stop offset="1" stop-color="#6c6f73"/>
    </linearGradient>
    <linearGradient id="concretoOscuro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5d61"/>
      <stop offset="1" stop-color="#3f4246"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.45" stop-color="#f0913a"/>
      <stop offset="1" stop-color="#9c4413"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3836"/>
      <stop offset="1" stop-color="#1b1b1c"/>
    </linearGradient>
    <radialGradient id="reflejo" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#f0913a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f0913a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="madera" width="18" height="40" patternUnits="userSpaceOnUse">
      <rect width="18" height="40" fill="url(#luz)"/>
      <rect x="0" width="2" height="40" fill="#7a3510" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Cielo -->
  <rect width="1600" height="1000" fill="url(#cielo)"/>

  <!-- Piso -->
  <rect y="760" width="1600" height="240" fill="url(#piso)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="0" y1="820" x2="1600" y2="820"/>
    <line x1="0" y1="890" x2="1600" y2="890"/>
    <line x1="0" y1="970" x2="1600" y2="970"/>
    <line x1="300" y1="760" x2="120" y2="1000"/>
    <line x1="700" y1="760" x2="640" y2="1000"/>
    <line x1="1100" y1="760" x2="1180" y2="1000"/>
    <line x1="1450" y1="760" x2="1600" y2="900"/>
  </g>

  <!-- Bloque superior (segundo piso) -->
  <rect x="760" y="210" width="640" height="150" fill="url(#concreto)"/>
  <rect x="860" y="245" width="440" height="95" fill="url(#madera)" opacity="0.92"/>
  <g fill="#2c2f33">
    <rect x="860" y="245" width="440" height="6"/>
    <rect x="1005" y="245" width="5" height="95"/>
    <rect x="1150" y="245" width="5" height="95"/>
  </g>

  <!-- Losa principal con el nombre de la notaría -->
  <rect x="120" y="360" width="1420" height="70" fill="url(#concreto)"/>
  <rect x="120" y="428" width="1420" height="8" fill="#3b3e42" opacity="0.6"/>
  <text x="300" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="14"
        fill="#3a3d41" opacity="0.85">NOTARÍA</text>

  <!-- Muro lateral izquierdo -->
  <rect x="120" y="430" width="120" height="330" fill="url(#concretoOscuro)"/>

  <!-- Fachada de vidrio con luz cálida -->
  <rect x="240" y="436" width="1200" height="324" fill="url(#madera)"/>
  <g fill="#23252a">
    <rect x="240" y="436" width="1200" height="8"/>
    <rect x="240" y="600" width="1200" height="5"/>
    <rect x="440" y="436" width="7" height="324"/>
    <rect x="640" y="436" width="7" height="324"/>
    <rect x="840" y="436" width="7" height="324"/>
    <rect x="1040" y="436" width="7" height="324"/>
    <rect x="1240" y="436" width="7" height="324"/>
  </g>
  <!-- Brillo del vidrio -->
  <polygon points="240,436 520,436 300,760 240,760" fill="#ffffff" opacity="0.06"/>
  <polygon points="840,436 980,436 760,760 640,760" fill="#ffffff" opacity="0.05"/>

  <!-- Columna derecha -->
  <rect x="1440" y="430" width="100" height="330" fill="url(#concretoOscuro)"/>

  <!-- Reflejo de la luz en el piso -->
  <rect x="140" y="760" width="1380" height="200" fill="url(#reflejo)"/>

  <!-- Plantas -->
  <g fill="#2d3a2c">
    <path d="M520 760 C 500 690, 470 650, 430 640 C 480 660, 505 690, 515 720 C 505 670, 490 620, 470 600 C 510 630, 530 680, 528 740 C 540 690, 560 650, 590 630 C 570 670, 545 710, 536 760 Z"/>
    <path d="M1180 760 C 1170 700, 1150 670, 1120 660 C 1160 675, 1178 700, 1186 730 C 1190 690, 1205 660, 1230 645 C 1210 680, 1196 720, 1192 760 Z"/>
  </g>
  <ellipse cx="528" cy="762" rx="70" ry="10" fill="#111" opacity="0.5"/>
  <ellipse cx="1188" cy="762" rx="55" ry="8" fill="#111" opacity="0.5"/>
</svg>
